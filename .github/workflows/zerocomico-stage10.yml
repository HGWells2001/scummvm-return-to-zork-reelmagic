name: zerocomico-stage10-compile

on:
  push:
    branches:
      - scratch/zerocomico-stage10
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current ScummVM headers
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git _upstream_scummvm

      - name: Syntax-check Stage 6 through Stage 10 C++
        run: |
          set -euxo pipefail
          for src in zerocomico-stage6/*.cpp zerocomico-stage7/*.cpp zerocomico-stage8/*.cpp zerocomico-stage9/*.cpp zerocomico-stage10/*.cpp; do
            echo "Checking $src"
            g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only               -D__MINGW32__               -I"$GITHUB_WORKSPACE/_upstream_scummvm"               -I"$GITHUB_WORKSPACE"               "$src"
          done

      - name: Install ScummVM build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build ScummVM common library
        run: |
          set -euxo pipefail
          cd _upstream_scummvm
          ./configure --disable-all-engines --disable-detection-full --disable-translation --disable-debug
          make -j2 common/libcommon.a

      - name: Link and run Stage 10 focused self-test
        run: |
          set -euxo pipefail
          g++ -std=c++17 -Wall -Wextra -DHAVE_CONFIG_H             -I"$GITHUB_WORKSPACE/_upstream_scummvm"             -I"$GITHUB_WORKSPACE"             zerocomico-stage6/mainplace.cpp             zerocomico-stage10/dialogue_document.cpp             zerocomico-stage10/dialogue_runtime.cpp             zerocomico-stage10/gameplay_dialogue_service.cpp             zerocomico-stage10/dialogue_mainplace_loader.cpp             zerocomico-stage10/stage10_selftest.cpp             _upstream_scummvm/common/libcommon.a             -pthread -ldl -lm             -o stage10_selftest
          ./stage10_selftest

      - name: Package Stage 10 modules
        run: |
          set -euxo pipefail
          zip -r ZeroComico_ScummVM_Stage10_modules.zip             zerocomico-stage6 zerocomico-stage7 zerocomico-stage8             zerocomico-stage9 zerocomico-stage10

      - name: Upload Stage 10 package
        uses: actions/upload-artifact@v4
        with:
          name: ZeroComico_ScummVM_Stage10_modules
          path: ZeroComico_ScummVM_Stage10_modules.zip
          if-no-files-found: error
