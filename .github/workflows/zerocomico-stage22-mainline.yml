name: zerocomico-stage22-mainline-compile

on:
  push:
    branches:
      - scratch/zerocomico-stage22-mainline
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current ScummVM headers
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git _upstream_scummvm

      - name: Syntax-check Stage 6 through Stage 22 C++
        run: |
          set -euxo pipefail
          for src in zerocomico-stage6/*.cpp zerocomico-stage7/*.cpp zerocomico-stage8/*.cpp zerocomico-stage9/*.cpp zerocomico-stage10/*.cpp zerocomico-stage11/*.cpp zerocomico-stage12/*.cpp zerocomico-stage13/*.cpp zerocomico-stage14/*.cpp zerocomico-stage15/*.cpp zerocomico-stage16/*.cpp zerocomico-stage17/*.cpp zerocomico-stage18/*.cpp zerocomico-stage19/*.cpp zerocomico-stage20/*.cpp zerocomico-stage21/*.cpp zerocomico-stage22/*.cpp; do
            echo "Checking $src"
            g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only               -D__MINGW32__               -isystem "$GITHUB_WORKSPACE/_upstream_scummvm"               -I"$GITHUB_WORKSPACE"               "$src"
          done

      - name: Install ScummVM build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build ScummVM common library
        run: |
          set -euxo pipefail
          cd _upstream_scummvm
          ./configure --disable-all-engines --disable-detection-full --disable-translation --disable-debug
          make -j2 common/libcommon.a

      - name: Link and run Stage 22 focused self-test
        run: |
          set -euxo pipefail
          g++ -std=c++17 -Wall -Wextra -DHAVE_CONFIG_H             -isystem "$GITHUB_WORKSPACE/_upstream_scummvm"             -I"$GITHUB_WORKSPACE"             zerocomico-stage16/shape_document.cpp             zerocomico-stage19/shape_geometry.cpp             zerocomico-stage21/room_topology.cpp             zerocomico-stage22/room_transition.cpp             zerocomico-stage22/stage22_selftest.cpp             _upstream_scummvm/common/libcommon.a             -pthread -ldl -lm             -o stage22_selftest
          ./stage22_selftest

      - name: Package Stage 22 modules
        run: |
          set -euxo pipefail
          zip -r ZeroComico_ScummVM_Stage22_modules.zip             zerocomico-stage6 zerocomico-stage7 zerocomico-stage8             zerocomico-stage9 zerocomico-stage10 zerocomico-stage11             zerocomico-stage12 zerocomico-stage13 zerocomico-stage14             zerocomico-stage15 zerocomico-stage16 zerocomico-stage17             zerocomico-stage18 zerocomico-stage19 zerocomico-stage20             zerocomico-stage21 zerocomico-stage22

      - name: Upload Stage 22 package
        uses: actions/upload-artifact@v4
        with:
          name: ZeroComico_ScummVM_Stage22_modules
          path: ZeroComico_ScummVM_Stage22_modules.zip
          if-no-files-found: error
