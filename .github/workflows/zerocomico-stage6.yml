name: zerocomico-stage6-compile

on:
  push:
    branches:
      - scratch/zerocomico-stage6
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current ScummVM headers
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git _upstream_scummvm

      - name: Syntax-check Stage 6 C++
        run: |
          set -euxo pipefail
          for src in zerocomico-stage6/*.cpp; do
            echo "Checking $src"
            g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
              -D__MINGW32__ \
              -I"$GITHUB_WORKSPACE/_upstream_scummvm" \
              -I"$GITHUB_WORKSPACE" \
              "$src"
          done

      - name: Package Stage 6 modules
        run: |
          set -euxo pipefail
          zip -r ZeroComico_ScummVM_Stage6_modules.zip zerocomico-stage6

      - name: Upload Stage 6 package
        uses: actions/upload-artifact@v4
        with:
          name: ZeroComico_ScummVM_Stage6_modules
          path: ZeroComico_ScummVM_Stage6_modules.zip
          if-no-files-found: error
