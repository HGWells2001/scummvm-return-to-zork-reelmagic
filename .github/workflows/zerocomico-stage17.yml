name: zerocomico-stage17-compile

on:
  push:
    branches:
      - scratch/zerocomico-stage17
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current ScummVM headers
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git _upstream_scummvm

      - name: Syntax-check Stage 6 through Stage 17 C++
        run: |
          set -euxo pipefail
          for src in zerocomico-stage6/*.cpp zerocomico-stage7/*.cpp zerocomico-stage8/*.cpp zerocomico-stage9/*.cpp zerocomico-stage10/*.cpp zerocomico-stage11/*.cpp zerocomico-stage12/*.cpp zerocomico-stage13/*.cpp zerocomico-stage14/*.cpp zerocomico-stage15/*.cpp zerocomico-stage16/*.cpp zerocomico-stage17/*.cpp; do
            echo "Checking $src"
            g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only               -D__MINGW32__               -I"$GITHUB_WORKSPACE/_upstream_scummvm"               -I"$GITHUB_WORKSPACE"               "$src"
          done

      - name: Install ScummVM build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build ScummVM common library
        run: |
          set -euxo pipefail
          cd _upstream_scummvm
          ./configure --disable-all-engines --disable-detection-full --disable-translation --disable-debug
          make -j2 common/libcommon.a

      - name: Link and run Stage 17 focused self-test
        run: |
          set -euxo pipefail
          g++ -std=c++17 -Wall -Wextra -DHAVE_CONFIG_H             -I"$GITHUB_WORKSPACE/_upstream_scummvm"             -I"$GITHUB_WORKSPACE"             zerocomico-stage6/menu_input.cpp             zerocomico-stage6/script_bridge.cpp             zerocomico-stage6/script_opcodes.cpp             zerocomico-stage8/gameplay_variables.cpp             zerocomico-stage8/object_handler_vm.cpp             zerocomico-stage16/shape_document.cpp             zerocomico-stage17/world_opcode_service.cpp             zerocomico-stage17/stage17_selftest.cpp             _upstream_scummvm/common/libcommon.a             -pthread -ldl -lm             -o stage17_selftest
          ./stage17_selftest

      - name: Package Stage 17 modules
        run: |
          set -euxo pipefail
          zip -r ZeroComico_ScummVM_Stage17_modules.zip             zerocomico-stage6 zerocomico-stage7 zerocomico-stage8             zerocomico-stage9 zerocomico-stage10 zerocomico-stage11             zerocomico-stage12 zerocomico-stage13 zerocomico-stage14             zerocomico-stage15 zerocomico-stage16 zerocomico-stage17

      - name: Upload Stage 17 package
        uses: actions/upload-artifact@v4
        with:
          name: ZeroComico_ScummVM_Stage17_modules
          path: ZeroComico_ScummVM_Stage17_modules.zip
          if-no-files-found: error
